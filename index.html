<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>PANGYO ADVENTURE</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;width:100%;height:100%;
  background:#0d0d0f;color:#fff;
  font-family:monospace;
  overflow:hidden;
  overscroll-behavior:none;
  touch-action:none;
}
body{
  display:flex;
  flex-direction:column;
  padding-top:env(safe-area-inset-top);
  padding-bottom:env(safe-area-inset-bottom);
}
#gameShell{
  flex:1;
  min-height:0;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:8px 8px 4px;
}
canvas{
  display:block;
  width:auto;
  height:auto;
  max-width:100%;
  max-height:100%;
  aspect-ratio:4/3;
  image-rendering:pixelated;
  image-rendering:crisp-edges;
  background:#111;
  border:4px solid #27272a;
  box-shadow:0 0 0 2px #5a5a5f;
}
#controls{
  flex:0 0 178px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  padding:8px 18px 14px;
  background:linear-gradient(#151518,#08080a);
  border-top:1px solid #2e2e32;
  user-select:none;
  -webkit-user-select:none;
}
#dpad{
  width:150px;height:150px;
  display:grid;
  grid-template-columns:50px 50px 50px;
  grid-template-rows:50px 50px 50px;
}
.ctrl{
  position:relative;
  z-index:10;
  border:2px solid #d8d8dc;
  background:#2a2a2f;
  color:#fff;
  font:bold 24px monospace;
  border-radius:12px;
  box-shadow:0 4px 0 #000;
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
}
.ctrl.pressed{
  transform:translateY(3px);
  box-shadow:0 1px 0 #000;
  background:#45454c;
}
#btnUp{grid-column:2;grid-row:1}
#btnLeft{grid-column:1;grid-row:2}
#btnRight{grid-column:3;grid-row:2}
#btnDown{grid-column:2;grid-row:3}
#actions{
  flex:1;
  max-width:190px;
  height:150px;
  position:relative;
}
#btnA{
  position:absolute;
  right:6px;top:18px;
  width:84px;height:84px;
  border-radius:50%;
  background:#a7354d;
  font-size:27px;
}
#btnQ{
  position:absolute;
  left:8px;bottom:16px;
  width:72px;height:48px;
  background:#365d91;
  font-size:17px;
}
#guide{
  position:relative;
  flex:0 0 32px;
  width:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:0;
  background:#151518;
  color:#fff;
  padding:6px 10px;
  border-top:1px solid #3a3a3f;
  border-bottom:1px solid #3a3a3f;
  font-size:10px;
  line-height:1.2;
  pointer-events:none;
  white-space:nowrap;
}
@media (orientation:landscape){
  #controls{flex-basis:112px;padding:4px 14px 7px}
  #dpad{width:108px;height:108px;grid-template-columns:36px 36px 36px;grid-template-rows:36px 36px 36px}
  .ctrl{font-size:18px;border-radius:9px}
  #actions{height:108px;max-width:150px}
  #btnA{width:66px;height:66px;top:6px;font-size:22px}
  #btnQ{width:58px;height:38px;bottom:5px;font-size:14px}
}
@media (min-width:900px) and (pointer:fine){
  #controls{max-width:520px;width:100%;margin:0 auto}
}
</style>
</head>
<body>
<div id="gameShell">
  <canvas id="game" width="640" height="480"></canvas>
</div>
<div id="guide">방향키 이동 · A 대화/조사 · Q 모험 노트</div>
<div id="controls">
  <div id="dpad">
    <button id="btnUp" class="ctrl" type="button"
      ontouchstart="onTouchDir(event,'up',this)" ontouchend="onTouchEnd(event,this)" ontouchcancel="onTouchEnd(event,this)"
      onmousedown="onMouseDir(event,'up',this)" onmouseup="onMouseEnd(event,this)" onmouseleave="onMouseEnd(event,this)">▲</button>
    <button id="btnLeft" class="ctrl" type="button"
      ontouchstart="onTouchDir(event,'left',this)" ontouchend="onTouchEnd(event,this)" ontouchcancel="onTouchEnd(event,this)"
      onmousedown="onMouseDir(event,'left',this)" onmouseup="onMouseEnd(event,this)" onmouseleave="onMouseEnd(event,this)">◀</button>
    <button id="btnRight" class="ctrl" type="button"
      ontouchstart="onTouchDir(event,'right',this)" ontouchend="onTouchEnd(event,this)" ontouchcancel="onTouchEnd(event,this)"
      onmousedown="onMouseDir(event,'right',this)" onmouseup="onMouseEnd(event,this)" onmouseleave="onMouseEnd(event,this)">▶</button>
    <button id="btnDown" class="ctrl" type="button"
      ontouchstart="onTouchDir(event,'down',this)" ontouchend="onTouchEnd(event,this)" ontouchcancel="onTouchEnd(event,this)"
      onmousedown="onMouseDir(event,'down',this)" onmouseup="onMouseEnd(event,this)" onmouseleave="onMouseEnd(event,this)">▼</button>
  </div>
  <div id="actions">
    <button id="btnQ" class="ctrl" type="button"
      ontouchstart="onTouchTap(event,'q',this)" onclick="onClickTap(event,'q',this)">Q</button>
    <button id="btnA" class="ctrl" type="button"
      ontouchstart="onTouchTap(event,'a',this)" onclick="onClickTap(event,'a',this)">A</button>
  </div>
</div>
<script>

ctx.imageSmoothingEnabled=false;
const T=32,W=20,H=15;
let frame=0;

const starters=[

const state={
 mode:'starter',
 starterIndex:0,
 starter:null,
 map:'office',
 p:{x:10,y:11,dir:'up'},
 partner:{x:10,y:12},
 dialogue:null,
 dialogueQueue:[],
 questOpen:false,
 transition:null,
 chapterCard:null,
 suppressUI:false,
 memories:[],
 hearts:[],
 flags:{
  beer:false, parkDone:false,
  sinchonDrink:false, sinchonYonsei:false, sinchonStatue:false, sinchonDone:false,
  homeCook:false, homeStudy:false, coffee:false,
  hkDimsum:false, hkEgg:false, hkBus:false, hkWrongStop:false, hongkongDone:false, nagoyaMiso:false, nagoyaHitsu:false, nagoyaTeba:false, nagoyaHarbs:false, nagoyaDone:false
 },
 items:[],
 endingLine:0
};

function current(){return maps[state.map]}
function tile(x,y){
 const m=current().tiles;
 if(x<0||y<0||x>=W||y>=H)return '#';
 return m[y][x];
}
function npcat(x,y){return current().npcs.find(n=>n.x===x&&n.y===y)}
function blocked(x,y){
 const t=tile(x,y);
 if('#ocuUslLnrtkvVawAm*DEBXMHTFS'.includes(t)) return true;
 if(npcat(x,y)) return true;
 return false;
}

function startTransition(label,nextMap,x=1,y=11,partnerX=1,partnerY=12){
  state.transition={label,frames:0,nextMap,x,y,partnerX,partnerY};
  state.suppressUI=true;
}

function setMap(name,x,y,px=x,py=y+1){
 state.map=name;state.p.x=x;state.p.y=y;state.partner.x=px;state.partner.y=py;
}
function facing(){
 let {x,y,dir}=state.p;
 if(dir==='up')y--;if(dir==='down')y++;if(dir==='left')x--;if(dir==='right')x++;
 return {x,y};
}

function addItem(name){ if(!state.items.includes(name)) state.items.push(name); }


function show(name,text,next=null){ state.dialogue={name,text,next}; }
function queue(lines,finalCb=null){
 state.dialogueQueue=[...lines];
 const nextLine=()=>{
   if(!state.dialogueQueue.length){ state.dialogue=null; if(finalCb) finalCb(); return; }
   const [name,text]=state.dialogueQueue.shift();
   show(name,text,nextLine);
 };
 nextLine();
}
function closeDialog(){
 if(!state.dialogue) return;
 const cb=state.dialogue.next;
 state.dialogue=null;
 if(cb) cb();
}

function objective(){
 const f=state.flags;
 if(!f.beer) return {type:'npc', map:'office', x:5, y:10, label:'편의점 직원에게 가서 맥주 2캔을 받자'};
 if(!f.parkDone){
   if(state.map==='office') return {type:'warp', map:'office', x:18, y:12, label:'오른쪽 출구로 가서 판교 공원으로 이동'};
   return {type:'tile', map:'park', x:5, y:4, label:'판교 공원 벤치에 앉아 맥주 마시기'};
 }
 if(!f.sinchonDone){
   if(state.map==='park') return {type:'warp', map:'park', x:18, y:12, label:'오른쪽 출구로 가서 신촌으로 이동'};
   if(!f.sinchonDrink) return {type:'tile', map:'sinchon', x:4, y:9, label:'주말 낮, 일단 낮술부터 시작하기'};
   if(!f.sinchonYonsei) return {type:'tile', map:'sinchon', x:8, y:8, label:'연세대학교 입구 들어가 보기'};
   if(!f.sinchonStatue) return {type:'tile', map:'sinchon', x:9, y:5, label:'연세대 안쪽 동상 구경하기'};
   return {type:'tile', map:'sinchon', x:15, y:10, label:'이제 LP바 찾아가기'};
 }
 if(!f.hongkongDone){
   if(state.map==='sinchon') return {type:'warp', map:'sinchon', x:18, y:11, label:'오른쪽 출구로 가서 홍콩으로 이동'};
   if(!f.hkDimsum) return {type:'tile', map:'hongkong', x:3, y:7, label:'홍콩에 왔으니 딤섬부터 먹기'};
   if(!f.hkEgg) return {type:'tile', map:'hongkong', x:9, y:7, label:'에그타르트 찾으러 가기'};
   if(!f.hkBus) return {type:'tile', map:'hongkong', x:14, y:7, label:'빅토리아 하버로 가는 버스 타기'};
   if(!f.hkWrongStop) return {type:'tile', map:'hongkong', x:17, y:7, label:'반대 방향인 걸 알아채고 내려보기'};
   return {type:'tile', map:'hongkong', x:14, y:10, label:'이번엔 제대로 빅토리아 하버 가기'};
 }
 if(!f.nagoyaDone){
   if(state.map==='hongkong') return {type:'warp', map:'hongkong', x:18, y:11, label:'오른쪽 출구로 가서 나고야로 이동'};
   if(!f.nagoyaMiso) return {type:'tile', map:'nagoya', x:3, y:10, label:'미소카츠 먹기'};
   if(!f.nagoyaHitsu) return {type:'tile', map:'nagoya', x:7, y:10, label:'히츠마부시 먹기'};
   if(!f.nagoyaTeba) return {type:'tile', map:'nagoya', x:11, y:10, label:'테바사키 먹기'};
   if(!f.nagoyaHarbs) return {type:'tile', map:'nagoya', x:15, y:10, label:'하브스 케이크 먹기'};
   return {type:'npc', map:'nagoya', x:16, y:8, label:'이번 여행의 진짜 목적, 말랑이 만나기'};
 }
 if(!(f.homeCook&&f.homeStudy&&f.coffee)){
   if(state.map==='nagoya') return {type:'warp', map:'nagoya', x:18, y:6, label:'오른쪽 출구로 가서 집으로 이동'};
   if(!f.homeCook) return {type:'tile', map:'home', x:5, y:4, label:'주방에서 같이 저녁 만들기'};
   if(!f.homeStudy) return {type:'tile', map:'home', x:12, y:4, label:'큰 테이블에서 같이 공부하기'};
   return {type:'tile', map:'home', x:15, y:9, label:'커피 코너에서 커피 내리기'};
 }
 if(state.map==='home') return {type:'warp', map:'home', x:18, y:12, label:'오른쪽 출구로 가서 마지막 장소로 이동'};
 return {type:'npc', map:'ending', x:10, y:9, label:'서연에게 다가가기'};
}
function objectiveText(){ return objective().label; }

function move(dx,dy,dir){
 if(state.mode!=='play'||state.dialogue||state.questOpen||state.transition||state.chapterCard)return;
 state.p.dir=dir;
 const nx=state.p.x+dx, ny=state.p.y+dy;
 if(!blocked(nx,ny)){
   const ox=state.p.x, oy=state.p.y;
   state.p.x=nx; state.p.y=ny;
   state.partner.x=ox; state.partner.y=oy;
   checkWarp();
   if(state.map==='ending'){
     const girl=current().npcs.find(n=>n.kind==='girl');
     if(girl){
       const d=Math.abs(girl.x-state.p.x)+Math.abs(girl.y-state.p.y);
       if(d<=1 && !state.dialogue){ endingDialogue(); }
     }
   }
 }
}
function checkWarp(){
 const t=tile(state.p.x,state.p.y);
 if(t!=='=') return;
 const f=state.flags;
 if(state.map==='office'){
   if(!f.beer){show('시스템','편의점에서 맥주를 먼저 사자.');return}
   startTransition('점심시간, 판교 공원','park',3,12,4,12);
 } else if(state.map==='park'){
   if(!f.parkDone){show('시스템','공원 벤치에서 먼저 맥주를 마시자.');return}
   startTransition('어느 주말 낮, 신촌','sinchon',2,12,2,13);
 } else if(state.map==='sinchon'){
   if(!f.sinchonDone){show('시스템','LP바에서 먼저 할 일을 마치자.');return}
   startTransition('첫 해외여행, 홍콩','hongkong',2,12,2,13);
 } else if(state.map==='hongkong'){
   if(!f.hongkongDone){show('시스템','홍콩에서 아직 할 일이 남아 있다.');return}
   startTransition('해달을 보러, 나고야','nagoya',2,12,2,13);
 } else if(state.map==='nagoya'){
   if(!f.nagoyaDone){show('시스템','말랑이를 먼저 만나자.');return}
   startTransition('그리고 다시, 집','home',13,11,13,12);
 } else if(state.map==='home'){
   if(!(f.homeCook&&f.homeStudy&&f.coffee)){show('시스템','평범한 하루를 조금 더 보내고 가자.');return}
   startTransition('마지막 장소','ending',10,13,9,13);
 }
}

function isInteractableTileForMap(mapName,ch){
 const sets={
   office:['C','c'],
   park:['b'],
   sinchon:['R','Y','s','L','l'],
   home:['K','d','C'],
   hongkong:['D','E','B','X','V','v'],
   nagoya:['M','H','T','C','W','w']
 };
 return (sets[mapName]||[]).includes(ch);
}
function nearbyInteractionTarget(){
 const obj=objective();
 const p=state.p;
 const candidates=[];

 for(const n of current().npcs){
   const d=Math.abs(n.x-p.x)+Math.abs(n.y-p.y);
   if(d<=3) candidates.push({kind:'npc',x:n.x,y:n.y,n,d});
 }

 for(let y=Math.max(0,p.y-2);y<=Math.min(H-1,p.y+2);y++){
   for(let x=Math.max(0,p.x-2);x<=Math.min(W-1,p.x+2);x++){
     if(isInteractableTileForMap(state.map,tile(x,y))){
       const d=Math.abs(x-p.x)+Math.abs(y-p.y);
       if(d<=3) candidates.push({kind:'tile',x,y,d});
     }
   }
 }

 candidates.sort((a,b)=>{
   const ap=(obj.map===state.map && Math.abs(a.x-obj.x)<=1 && Math.abs(a.y-obj.y)<=1)?-100:0;
   const bp=(obj.map===state.map && Math.abs(b.x-obj.x)<=1 && Math.abs(b.y-obj.y)<=1)?-100:0;
   return (a.d+ap)-(b.d+bp);
 });
 return candidates[0]||null;
}
function interactTileAt(x,y){

function interact(){
 if(state.mode!=='play'||state.transition||state.chapterCard) return;

 // 열린 대화는 어떤 맵이든 Space/Enter로 다음 줄 진행
 if(state.dialogue){ closeDialog(); return; }

 // 마지막 맵: 서연 근처에서는 방향과 상관없이 대화 시작
 if(state.map==='ending'){
   const girl=current().npcs.find(n=>n.kind==='girl');
   if(girl){
     const d=Math.abs(girl.x-state.p.x)+Math.abs(girl.y-state.p.y);
     if(d<=3){ endingDialogue(); return; }
   }
 }

 // 모험 노트가 열려 있으면 닫기
 if(state.questOpen){ state.questOpen=false; return; }

 // 우선 바라보는 칸과 상호작용
 const f=facing();
 const n=npcat(f.x,f.y);
 if(n){ talk(n); return; }
 if(interactTileAt(f.x,f.y)) return;

 // 정확히 한 칸 앞이 아니어도 가까운 목표를 자동으로 잡기
 const near=nearbyInteractionTarget();
 if(near){   if(near.kind==='npc'){ talk(near.n); return; }
   if(near.kind==='tile' && interactTileAt(near.x,near.y)) return;
 }

 const obj=objective();
 if(obj.map===state.map){
   show('힌트','느낌표 근처에서 스페이스바를 누르면 돼.');
 }else{
   show('힌트','오른쪽 출구로 이동해보자.');
 }
}

function drawEndingDetails(){
 if(state.map!=='ending') return;
 // soft aisle highlight
 ctx.fillStyle='rgba(255,255,255,0.10)';
 ctx.fillRect(8*T+8,2*T,3*T,10*T);

 // warm lamps with a faint animated halo
 const pulse=0.10+0.04*Math.sin(frame/18);
 for(const [x,y] of [[6,3],[13,3],[6,6],[13,6],[6,9],[13,9]]){
   const px=x*T,py=y*T;
   ctx.fillStyle='#cda36d';ctx.fillRect(px+14,py+10,4,16);
   ctx.fillStyle='#ffe6a6';ctx.fillRect(px+10,py+6,12,8);
   ctx.fillStyle='rgba(255,230,166,'+pulse+')';
   ctx.fillRect(px+6,py+3,20,15);
 }

 // gently drifting petals
 const petals=[[8,10,0],[9,11,8],[10,10,15],[11,11,23],[9,8,31],[10,7,39],[8,6,47],[11,5,55]];
 ctx.fillStyle='rgba(255,170,190,0.62)';
 for(const [x,y,phase] of petals){
   const drift=Math.sin((frame+phase)/20)*5;
   const fall=((frame+phase)%90)/30;
   ctx.fillRect(x*T+14+drift,y*T+17+fall,4,3);
 }

 // subtle glow behind Seoyeon
 const girl=current().npcs.find(n=>n.kind==='girl');
 if(girl){
   ctx.save();
   ctx.globalAlpha=0.10+0.04*Math.sin(frame/16);
   ctx.fillStyle='#fff0c8';
   ctx.beginPath();
   ctx.arc(girl.x*T+16,girl.y*T+18,30,0,Math.PI*2);
   ctx.fill();
   ctx.restore();
 }
}

function wrap(text,x,y,maxW,lineH){
 let yy=y;
 for(const para of text.split('\n')){
   if(!para){yy+=lineH;continue;}
   let line='';
   for(const ch of para){
     const t=line+ch;
     if(ctx.measureText(t).width>maxW){ ctx.fillText(line,x,yy); yy+=lineH; line=ch; }
     else line=t;
   }
   if(line){ ctx.fillText(line,x,yy); yy+=lineH; }
 }
 return yy;
}
function markerXY(obj){

 return {x:obj.x*T+16,y:obj.y*T+6};
}

 if(!state.transition)return false;
 const tr=state.transition;tr.frames++;
 ctx.fillStyle='#111826';ctx.fillRect(0,0,640,480);
 if(tr.label){
   ctx.fillStyle='#f7f1d5';ctx.font='20px monospace';ctx.textAlign='center';ctx.fillText(tr.label,320,240);ctx.textAlign='left';
 }
 if(tr.frames===55){
   setMap(tr.nextMap,tr.x,tr.y,tr.partnerX,tr.partnerY);
 }
 if(tr.frames>95){
   state.transition=null;
   state.suppressUI=(state.map==='ending');
 }
 return true;
}


function drawEnd(){
 ctx.fillStyle='#111826';ctx.fillRect(0,0,640,480);
 ctx.fillStyle='#f7f1d5';ctx.textAlign='center';
 ctx.font='bold 28px monospace';ctx.fillText('우리 앞으로도 행복하자!',320,205);
 ctx.font='bold 30px monospace';ctx.fillText('Marry me! 💗',320,270);
 ctx.font='14px monospace';ctx.fillText('THE END',320,330);
 ctx.textAlign='left';
}
function draw(){
 frame++;
 if(state.mode==='starter'){ drawStarter(); return; }
 if(state.mode==='end'){ drawEnd(); return; }
 if(drawChapterCard()) return;
 if(drawTransition()) return;

 const m=current();
 for(let y=0;y<H;y++) for(let x=0;x<W;x++) drawTile(x,y,m.tiles[y][x]);
 if(state.map==='office') drawOfficeDetails();
 if(state.map==='park') drawParkDetails();
 if(state.map==='sinchon') drawSinchonDetails();
 if(state.map==='home'){ drawHomeDetails(); drawHomeRug(); }
 if(state.map==='hongkong') drawHongKongDetails();
 if(state.map==='nagoya') drawNagoyaDetails();
 if(state.map==='ending') drawEndingDetails();
 for(const n of m.npcs) drawNpc(n);
 if(state.starter) drawMonster(state.starter,state.partner.x*T,state.partner.y*T,1);
 drawTrainer(state.p.x*T,state.p.y*T);

 if(state.map==='ending'){
   state.suppressUI=true;
 }else{
   drawLandmarkLabels();
   drawSparkles();
   drawObjectiveMarker();
   drawDirectionArrow();
 }
 if(!state.suppressUI) drawUI();
 if(state.suppressUI && state.dialogue) drawDialogueOnly();

}


function isActionKey(e){
  return e.code==='Space' || e.key===' ' || e.key==='Spacebar' ||
         e.code==='Enter' || e.key==='Enter' || e.keyCode===32 || e.keyCode===13;
}

function loop(){ draw(); requestAnimationFrame(loop); }
loop();


function doAction(){
  if(state.transition || state.chapterCard) return;
  if(state.mode==='starter'){
    state.starter=starters[state.starterIndex];
    state.mode='play';
    queue([
      ['시스템',state.starter.name+'가 파트너가 되었다!'],
      ['동료','점심시간인데, 일단 편의점 쪽으로 가보자.']
    ]);
    draw(); return;
  }
  if(state.mode==='end') return;
  if(state.questOpen){ state.questOpen=false; draw(); return; }
  interact();
  draw();
}

function doMenu(){
  if(state.mode!=='play' || state.transition || state.chapterCard) return;
  state.questOpen=!state.questOpen;
  state.dialogue=null;
  draw();
}

function doMove(dir){
  if(state.transition || state.chapterCard) return;

  if(state.mode==='starter'){
    if(dir==='left' || dir==='up') state.starterIndex=(state.starterIndex+2)%3;
    if(dir==='right' || dir==='down') state.starterIndex=(state.starterIndex+1)%3;
    draw(); return;
  }

  if(state.mode!=='play' || state.questOpen) return;

  if(dir==='up') move(0,-1,'up');
  if(dir==='down') move(0,1,'down');
  if(dir==='left') move(-1,0,'left');
  if(dir==='right') move(1,0,'right');
  draw();
}

// Physical keyboard remains available for desktop testing.
document.addEventListener('keydown', e=>{
  const k=(e.key||'').toLowerCase();
  if(['arrowup','arrowdown','arrowleft','arrowright',' ','enter','q','w','a','s','d'].includes(k)){
    e.preventDefault();
  }
  if(k==='arrowup'||k==='w') doMove('up');
  else if(k==='arrowdown'||k==='s') doMove('down');
  else if(k==='arrowleft'||k==='a') doMove('left');
  else if(k==='arrowright'||k==='d') doMove('right');
  else if(k==='q') doMenu();
  else if(k===' '||k==='enter') doAction();
},{passive:false});

// Mobile touch/click input.
// touchstart gives the fastest response on phones; click is a fallback for browsers/webviews.
let lastTouchTime = 0;
let holdDelay = null;
let holdTimer = null;

function pressVisual(el){
  el.classList.add('pressed');
}
function releaseVisual(el){
  el.classList.remove('pressed');
}

function stopHold(el){
  clearTimeout(holdDelay);
  clearInterval(holdTimer);
  holdDelay=null;
  holdTimer=null;
  if(el) releaseVisual(el);
}

function startDirection(dir, el){
  pressVisual(el);
  doMove(dir);
  clearTimeout(holdDelay);
  clearInterval(holdTimer);
  holdDelay=setTimeout(()=>{
    holdTimer=setInterval(()=>doMove(dir),120);
  },260);
}

function onTouchDir(e, dir, el){
  e.preventDefault();
  e.stopPropagation();
  lastTouchTime=Date.now();
  startDirection(dir,el);
}
function onTouchEnd(e, el){
  e.preventDefault();
  e.stopPropagation();
  stopHold(el);
}
function onMouseDir(e, dir, el){
  if(Date.now()-lastTouchTime < 700) return;
  e.preventDefault();
  startDirection(dir,el);
}
function onMouseEnd(e, el){
  if(Date.now()-lastTouchTime < 700) return;
  e.preventDefault();
  stopHold(el);
}

function runTap(kind, el){
  pressVisual(el);
  setTimeout(()=>releaseVisual(el),100);
  if(kind==='a') doAction();
  if(kind==='q') doMenu();
}
function onTouchTap(e, kind, el){
  e.preventDefault();
  e.stopPropagation();
  lastTouchTime=Date.now();
  runTap(kind,el);
}
function onClickTap(e, kind, el){
  e.preventDefault();
  e.stopPropagation();
  if(Date.now()-lastTouchTime < 700) return;
  runTap(kind,el);
}

document.addEventListener('contextmenu',e=>e.preventDefault());

</script>
